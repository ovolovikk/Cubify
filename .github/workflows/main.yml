name: Cubify CI

on:
  push:

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies for graphics test
        run: python -m pip install --upgrade pip opencv-python

      - name: Install software OpenGL driver
        run: winget install --accept-source-agreements --accept-package-agreements -e Microsoft.OpenCLGLVulkanCompatibilityPack

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run graphics auto-test (Debug)
        id: test_debug
        continue-on-error: true
        working-directory: build/Debug
        run: python tests/test.py Cubify.exe

      - name: Run graphics auto-test (Release)
        id: test_release
        continue-on-error: true
        working-directory: build/Release
        run: python tests/test.py Cubify.exe

      - name: Prepare release package
        run: Compress-Archive -Path build/Release/* -DestinationPath Cubify-release.zip -Force

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubify-release
          path: Cubify-release.zip
          retention-days: 3

      - name: Upload graphics test artifacts (Debug + Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-autotest-images
          path: |
            build/*/tests/test_output.png
            build/*/tests/test_diff.png
            build/*/tests/test_result.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Fail workflow if any graphics auto-test failed
        if: always()
        run: |
          if ("${{ steps.test_debug.outcome }}" -ne "success" -or "${{ steps.test_release.outcome }}" -ne "success") {
            Write-Error "Graphics auto-test failed (Debug or Release)."
          }
