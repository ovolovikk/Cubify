name: Cubify CI

on:
  push:

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python deps for graphics test
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python

      - name: Install software OpenGL driver
        run: winget install --accept-source-agreements --accept-package-agreements -e Microsoft.OpenCLGLVulkanCompatibilityPack


      - name: Build Debug (.bat)
        run: cmd /c "call build_debug.bat < nul"

      - name: Build Release (.bat)
        run: cmd /c "call build_release.bat < nul"

      - name: Run graphics auto-test (Debug)
        id: test_debug
        continue-on-error: true
        working-directory: build/Debug
        run: python tests/test.py Cubify.exe

      - name: Run graphics auto-test (Release)
        id: test_release
        continue-on-error: true
        working-directory: build/Release
        run: python tests/test.py Cubify.exe

      - name: Prepare release package
        run: |
          New-Item -ItemType Directory -Force -Path artifact-release | Out-Null
          Copy-Item build/Release/Cubify.exe artifact-release/
          Copy-Item build/Release/glew32.dll artifact-release/
          Copy-Item build/Release/config.json artifact-release/
          Copy-Item -Recurse build/Release/assets artifact-release/assets
          Copy-Item -Recurse build/Release/shaders artifact-release/shaders
          Copy-Item -Recurse build/Release/tests artifact-release/tests
          Compress-Archive -Path artifact-release/* -DestinationPath Cubify-release.zip -Force

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubify-release
          path: Cubify-release.zip
          retention-days: 3

      - name: Upload graphics test artifacts (Debug + Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-autotest-images
          path: |
            build/Debug/tests/test_output.png
            build/Debug/tests/test_diff.png
            build/Debug/tests/test_result.txt
            build/Release/tests/test_output.png
            build/Release/tests/test_diff.png
            build/Release/tests/test_result.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Fail workflow if any graphics auto-test failed
        if: always()
        run: |
          if ("${{ steps.test_debug.outcome }}" -ne "success" -or "${{ steps.test_release.outcome }}" -ne "success") {
            Write-Error "Graphics auto-test failed (Debug or Release)."
            exit 1
          }
